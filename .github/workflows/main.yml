name: Build Saiguu Kernel

on:
  push:
    branches:
      - saiguu_v1
  workflow_dispatch:

env:
  KERNEL_DEFCONFIG: "blossom_defconfig"
  KERNEL_ARCH: "arm64"
  KBUILD_BUILD_USER: "Saiguu-CI"
  KBUILD_BUILD_HOST: "github-actions"

jobs:
  build:
    name: Build Saiguu Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            cpio \
            kmod \
            git \
            zip \
            curl \
            ca-certificates \
            wget \
            python3 \
            rsync

      - name: Configure Git
        run: |
          git config --global url."https://".insteadOf git://

      - name: Clone Clang r383902
        run: |
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            /tmp/clang

      - name: Clone Android GCC ARM64
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            /tmp/gcc-aarch64

      - name: Clone Android GCC ARM32
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            /tmp/gcc-arm

      - name: Verify toolchains
        run: |
          echo "=== Clang ==="
          /tmp/clang/bin/clang --version || true

          echo "=== GCC ARM64 ==="
          /tmp/gcc-aarch64/bin/aarch64-linux-android-gcc --version

          echo "=== GCC ARM32 ==="
          /tmp/gcc-arm/bin/arm-linux-androideabi-gcc --version

      - name: Configure kernel
        run: |
          export PATH="/tmp/clang/bin:/tmp/gcc-aarch64/bin:/tmp/gcc-arm/bin:${PATH}"

          export ARCH="${KERNEL_ARCH}"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          make O=out \
            ARCH="${ARCH}" \
            "${KERNEL_DEFCONFIG}"

      - name: Build kernel
        run: |
          export PATH="/tmp/clang/bin:/tmp/gcc-aarch64/bin:/tmp/gcc-arm/bin:${PATH}"

          export ARCH="${KERNEL_ARCH}"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          make -j"$(nproc)" \
            O=out \
            ARCH="${ARCH}" \
            CC=clang \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            2>&1 | tee build.log
            
      - name: Package AnyKernel3
        run: |
          set -e

          echo "=== Cloning AnyKernel ==="
          git clone --depth=1 \
            https://github.com/Iam-nishan/anykernel.git \
            anykernel

          echo "=== Kernel output ==="
          ls -lah out/arch/arm64/boot/

          cd anykernel

          rm -f Image Image.gz Image.gz-dtb zImage *.dtb *.dtb.img

          if [ -f "../out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp ../out/arch/arm64/boot/Image.gz-dtb Image.gz-dtb
            echo "Using Image.gz-dtb"

          elif [ -f "../out/arch/arm64/boot/Image.gz" ]; then
            cp ../out/arch/arm64/boot/Image.gz Image.gz
            echo "Using Image.gz"

          elif [ -f "../out/arch/arm64/boot/Image" ]; then
            cp ../out/arch/arm64/boot/Image Image
            echo "Using Image"

          else
            echo "ERROR: No kernel image found"
            exit 1
          fi

          for dtb in ../out/arch/arm64/boot/*.dtb; do
            if [ -f "$dtb" ]; then
              cp "$dtb" .
              echo "Copied $(basename "$dtb")"
            fi
          done

          cat > anykernel.sh << 'EOF'
          properties() { '
          kernel.string=Saiguu Kernel for blossom
          do.devicecheck=1
          device.name1=blossom
          device.name2=dandelion
          device.name3=angelica
          device.name4=angelican
          device.name5=cattail
          device.name6=angelicain
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }

          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          echo "=== AnyKernel contents ==="
          ls -lah

         # zip -r9 \
            "../Saiguu-Kernel-${GITHUB_SHA}.zip" \
            * \
            -x .git README.md '*placeholder'

          cd ..

          echo "=== Final package ==="
          ls -lh "Saiguu-Kernel-${GITHUB_SHA}.zip"

      - name: Upload AnyKernel3 package
        uses: actions/upload-artifact@v4
        with:
          name: Saiguu-Kernel-${{ github.sha }}
          path: Saiguu-Kernel-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Show kernel output
        if: always()
        run: |
          echo "=== Kernel output ==="
          ls -lah out/arch/arm64/boot/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saiguu-build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: warn
          retention-days: 14
